name: Preparation for the official start of the compilation steps.

runs:
  using: composite

  steps:
    - name: Validate kernel source
      shell: bash
      run: |
        set -euxo pipefail

        kernel_dir="$GITHUB_WORKSPACE/device_kernel"

        test -d "$kernel_dir" || {
          echo "::error::Kernel source directory is missing: $kernel_dir"
          exit 1
        }

        test -f "$kernel_dir/Makefile" || {
          echo "::error::Kernel source is invalid: $kernel_dir"
          exit 1
        }

        cd "$kernel_dir"

        kernel_version="$(
          head -n 3 Makefile |
          grep -E 'VERSION|PATCHLEVEL' |
          awk '{print $3}' |
          paste -sd '.'
        )"

        test -n "$kernel_version"

        echo "[+] Kernel version: $kernel_version"
        echo "KERNEL_VERSION=$kernel_version" >> "$GITHUB_ENV"
        echo "FIRST_VERSION=${kernel_version%%.*}" >> "$GITHUB_ENV"
        echo "SECOND_VERSION=$(echo "$kernel_version" | cut -d. -f2)" >> "$GITHUB_ENV"

    - name: Detect kernel architecture
      shell: bash
      run: |
        set -euxo pipefail

        kernel_dir="$GITHUB_WORKSPACE/device_kernel"

        if [[ -d "$kernel_dir/arch/arm64/configs" ]]; then
          echo "KERNEL_ARCH=arm64" >> "$GITHUB_ENV"
          echo "[+] Kernel architecture: arm64"
        else
          echo "::error::Non-ARM64 devices are not supported"
          exit 1
        fi

    - name: Validate KernelSU checkout
      shell: bash
      run: |
        set -euxo pipefail

        kernel_dir="$GITHUB_WORKSPACE/device_kernel"
        ksu_dir="$kernel_dir/KernelSU"

        test -d "$kernel_dir"
        test -f "$kernel_dir/Makefile"

        if [[ ! -d "$ksu_dir" ]]; then
          echo "::error::KernelSU checkout is missing: $ksu_dir"
          exit 1
        fi

        if [[ ! -f "$ksu_dir/kernel/Makefile" ]]; then
          echo "::error::KernelSU checkout is invalid: $ksu_dir"
          echo "::error::Expected: $ksu_dir/kernel/Makefile"
          find "$ksu_dir" -maxdepth 2 -type f | sort || true
          exit 1
        fi

        echo "[+] KernelSU checkout: $ksu_dir"
        echo "[+] KernelSU commit:"
        git -C "$ksu_dir" rev-parse HEAD

    - name: Get packing tools
      shell: bash
      run: |
        set -euxo pipefail

        kernel_dir="$GITHUB_WORKSPACE/device_kernel"

        if [[ "$PACK_METHOD" == "Anykernel3" ]]; then
          ak3_dir="$kernel_dir/Anykernel3"

          echo "[+] Preparing AnyKernel3"
          echo "[+] Source: $AK3_SOURCE"
          echo "[+] Commit: $AK3_COMMIT"

          if [[ -d "$ak3_dir/.git" ]]; then
            echo "[+] Existing AnyKernel3 repository found"
            cd "$ak3_dir"

            git remote set-url origin "$AK3_SOURCE"

            git fetch \
              --filter=blob:none \
              --no-tags \
              --depth=1 \
              origin \
              "$AK3_COMMIT"

            git checkout --detach "$AK3_COMMIT"
          else
            rm -rf "$ak3_dir"

            git clone \
              --filter=blob:none \
              --no-checkout \
              --no-tags \
              "$AK3_SOURCE" \
              "$ak3_dir"

            cd "$ak3_dir"

            # A shallow clone contains only the default branch tip.
            # Fetch the exact pinned revision before checking it out.
            git fetch \
              --filter=blob:none \
              --no-tags \
              --depth=1 \
              origin \
              "$AK3_COMMIT"

            git checkout --detach "$AK3_COMMIT"
          fi

          test -f "$ak3_dir/anykernel.sh"
          test "$(git -C "$ak3_dir" rev-parse HEAD)" = "$AK3_COMMIT"

          echo "[+] AnyKernel3 checkout verified:"
          git -C "$ak3_dir" rev-parse HEAD

        elif [[ "$PACK_METHOD" == "MKBOOTIMG" ]] || \
             [[ "$DEFCONFIG_FROM_BOOT" == "true" ]]; then

          cd "$GITHUB_WORKSPACE"

          rm -rf "$GITHUB_WORKSPACE/mkboottools"

          git clone \
            --depth=1 \
            --branch main-kernel-build-2024 \
            https://android.googlesource.com/platform/system/tools/mkbootimg \
            "$GITHUB_WORKSPACE/mkboottools"

          if [[ -n "${CURLX:-}" ]]; then
            $CURLX \
              "$BOOT_SOURCE" \
              "$GITHUB_WORKSPACE/boot_source_${DEVICE_NAME}.img"
          else
            curl -L --fail --retry 3 \
              "$BOOT_SOURCE" \
              -o "$GITHUB_WORKSPACE/boot_source_${DEVICE_NAME}.img"
          fi

          test -f "$GITHUB_WORKSPACE/boot_source_${DEVICE_NAME}.img"

          echo "[+] MKBOOTIMG tools prepared"

        else
          echo "::error::No valid packing method configured"
          exit 1
        fi

        echo "PACK_METHOD=$PACK_METHOD" >> "$GITHUB_ENV"

    - name: Get DEFCONFIG
      if: env.DEFCONFIG_SOURCE != '' || env.DEFCONFIG_FROM_BOOT == 'true'
      shell: bash
      run: |
        set -euxo pipefail

        kernel_dir="$GITHUB_WORKSPACE/device_kernel"
        config="$kernel_dir/arch/$KERNEL_ARCH/configs/$DEFCONFIG_NAME"

        mkdir -p "$(dirname "$config")"

        if [[ -n "$DEFCONFIG_SOURCE" ]]; then
          if [[ -n "${CURLX:-}" ]]; then
            $CURLX "$DEFCONFIG_SOURCE" "$config"
          else
            curl -L --fail --retry 3 "$DEFCONFIG_SOURCE" -o "$config"
          fi

        elif [[ "$DEFCONFIG_FROM_BOOT" == "true" ]]; then
          boot_image="$GITHUB_WORKSPACE/boot_source_${DEVICE_NAME}.img"

          test -f "$boot_image"

          "$GITHUB_WORKSPACE/mkboottools/unpack_bootimg.py" \
            --boot_img "$boot_image"

          test -f "$GITHUB_WORKSPACE/out/kernel"

          "$kernel_dir/scripts/extract-ikconfig" \
            "$GITHUB_WORKSPACE/out/kernel" \
            > "$config"

        elif [[ -n "$DEFCONFIG_ORIGIN_IMAGE" ]]; then
          image="$kernel_dir/Image"

          if [[ -n "${CURLX:-}" ]]; then
            $CURLX "$DEFCONFIG_ORIGIN_IMAGE" "$image"
          else
            curl -L --fail --retry 3 "$DEFCONFIG_ORIGIN_IMAGE" -o "$image"
          fi

          "$kernel_dir/scripts/extract-ikconfig" \
            "$image" \
            > "$config"
        fi

        test -f "$config"
        echo "[+] DEFCONFIG prepared: $config"

    - name: Clean KernelSU and hooks
      shell: bash
      run: |
        set -euxo pipefail

        kernel_dir="$GITHUB_WORKSPACE/device_kernel"

        test -f /tmp/Bin/clean_hook.sh

        cp /tmp/Bin/clean_hook.sh "$kernel_dir/"
        cd "$kernel_dir"

        bash clean_hook.sh

        echo "[+] Kernel cleanup completed"

    - name: Configure KernelSU
      shell: bash
      run: |
        set -euxo pipefail

        kernel_dir="$GITHUB_WORKSPACE/device_kernel"
        ksu_dir="$kernel_dir/KernelSU"

        if [[ "${KERNELSU_AUTO_GET,,}" != "true" ]]; then
          echo "[+] Automatic KernelSU retrieval disabled"
          echo "[+] Reusing manually prepared checkout"

          test -d "$ksu_dir"
          test -f "$ksu_dir/kernel/Makefile"

          echo "KERNELSU_NAME=KernelSU-Next" >> "$GITHUB_ENV"
          echo "KERNELSU_FOLDER=KernelSU" >> "$GITHUB_ENV"
        else
          echo "::error::KERNELSU_AUTO_GET must be false"
          echo "::error::KernelSU is prepared by the parent workflow"
          exit 1
        fi

        test -d "$ksu_dir/kernel"

        mkdir -p "$kernel_dir/drivers"

        rm -rf "$kernel_dir/drivers/kernelsu"

        ln -s \
          "../KernelSU/kernel" \
          "$kernel_dir/drivers/kernelsu"

        test -e "$kernel_dir/drivers/kernelsu"

        echo "[+] KernelSU integration path:"
        echo "    $kernel_dir/drivers/kernelsu"

    - name: Configure KernelSU Kconfig integration
      shell: bash
      run: |
        set -euxo pipefail

        kernel_dir="$GITHUB_WORKSPACE/device_kernel"
        ksu_dir="$kernel_dir/KernelSU"

        test -f "$ksu_dir/kernel/Makefile"

        if ! grep -q 'obj-$(CONFIG_KSU) += kernelsu/' \
            "$kernel_dir/drivers/Makefile"; then
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' \
            >> "$kernel_dir/drivers/Makefile"
        fi

        if ! grep -q 'source "drivers/kernelsu/Kconfig"' \
            "$kernel_dir/drivers/Kconfig"; then
          sed -i \
            '/endmenu/i source "drivers/kernelsu/Kconfig"' \
            "$kernel_dir/drivers/Kconfig"
        fi

        echo "[+] KernelSU Kconfig integration configured"

    - name: Apply SukiSU-Ultra compatibility patch
      shell: bash
      run: |
        set -euxo pipefail

        ksu_dir="$GITHUB_WORKSPACE/device_kernel/KernelSU"

        test -d "$ksu_dir"
        test -f "$ksu_dir/kernel/Makefile"

        if [[ "$KERNELSU_SOURCE" == *"SukiSU"* ]] || \
           [[ "${KERNELSU_AUTO_FORK,,}" == "sukisu" ]]; then

          patch_file="/tmp/Patches/Patch/sukisu_ultra_fixed.patch"

          if [[ -f "$patch_file" ]]; then
            cd "$ksu_dir/kernel"
            cp "$patch_file" .
            patch -p1 < "$(basename "$patch_file")"
            echo "[+] SukiSU-Ultra patch applied"
          else
            echo "[+] SukiSU-Ultra patch not found; skipped"
          fi
        else
          echo "[+] SukiSU-Ultra patch not required"
        fi

    - name: Apply xxKSU SUSFS compatibility patch
      shell: bash
      run: |
        set -euxo pipefail

        ksu_dir="$GITHUB_WORKSPACE/device_kernel/KernelSU"

        test -d "$ksu_dir"
        test -f "$ksu_dir/kernel/Makefile"

        if [[ "${KERNELSU_AUTO_FORK,,}" == "xxksu" ]] || \
           [[ "$KERNELSU_SOURCE" == *"backslashxx"* ]]; then

          if [[ "$SUSFS_ENABLE" == "true" ]]; then
            cd "$ksu_dir/kernel"

            curl -fsSL \
              "https://github.com/midori01/KernelSU/commit/xx.patch" |
              patch -p1 || true

            echo "[+] xxKSU SUSFS patch applied"
          fi
        else
          echo "[+] xxKSU patch not required"
        fi

    - name: KPM function support
      if: env.KPM_ENABLE == 'true'
      shell: bash
      run: |
        set -euxo pipefail

        kernel_dir="$GITHUB_WORKSPACE/device_kernel"
        config="$kernel_dir/arch/$KERNEL_ARCH/configs/$DEFCONFIG_NAME"

        mkdir -p "$(dirname "$config")"

        {
          echo "CONFIG_DEBUG_KERNEL=y"
          echo "CONFIG_KALLSYMS=y"
          echo "CONFIG_KALLSYMS_ALL=y"
        } >> "$config"

        if [[ "$KPM_INLINE" == "true" ]]; then
          if [[ "$KERNELSU_SOURCE" != *"SukiSU"* ]] && \
             [[ "${KERNELSU_AUTO_FORK,,}" != "sukisu" ]]; then
            echo "::error::KPM inline requires SukiSU-Ultra"
            exit 1
          fi

          if [[ -f "$kernel_dir/include/linux/set_memory.h" ]]; then
            curl -L --fail --retry 3 \
              "$KPM_PATCH_SOURCE" \
              -o "$kernel_dir/patch"
          else
            cp /tmp/Patches/Patch/set_memory_to_49_and_low.patch \
              "$kernel_dir/"

            cd "$kernel_dir"
            patch -p1 < set_memory_to_49_and_low.patch || true

            curl -L --fail --retry 3 \
              "$KPM_PATCH_SOURCE" \
              -o "$kernel_dir/patch"
          fi

          chmod +x "$kernel_dir/patch"
          echo "[+] KPM inline support prepared"

        elif [[ "$KPM_KPATCH_NEXT" == "true" ]]; then
          cd "$kernel_dir"

          curl -L --fail --retry 3 \
            "https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kpimg-linux" \
            -o kpimg-linux

          curl -L --fail --retry 3 \
            "https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kptools-linux" \
            -o kptools-linux

          chmod +x kpimg-linux kptools-linux
          echo "[+] KPatch-Next tools prepared"

        else
          echo "CONFIG_KPM=y" >> "$config"
          echo "[+] KPM configuration enabled"
        fi

    - name: Enable KernelSU in DEFCONFIG
      shell: bash
      run: |
        set -euxo pipefail

        config="$GITHUB_WORKSPACE/device_kernel/arch/$KERNEL_ARCH/configs/$DEFCONFIG_NAME"

        mkdir -p "$(dirname "$config")"

        if ! grep -q '^CONFIG_KSU=y$' "$config" 2>/dev/null; then
          echo "CONFIG_KSU=y" >> "$config"
        fi

        echo "[+] CONFIG_KSU=y enabled"
        grep -n '^CONFIG_KSU=' "$config"