name: 'Preparation for the official start of the compilation steps.'

runs:
  using: 'composite'

  steps:

      # ============================================================
      # Get Kernel
      # ============================================================

      - name: Get Kernel
        shell: bash
        run: |
          set -euxo pipefail

          kernel_dir="$GITHUB_WORKSPACE/device_kernel"

          echo "::group::[+] Validate kernel source"

          if [[ ! -d "$kernel_dir" ]]; then
            echo "::error::Kernel source directory is missing: $kernel_dir"
            exit 1
          fi

          if [[ ! -f "$kernel_dir/Makefile" ]]; then
            echo "::error::Kernel source is invalid: $kernel_dir"
            exit 1
          fi

          echo "[+] Kernel source: $kernel_dir"

          cd "$kernel_dir"

          KERNEL_VERSION=$(
            head -n 3 Makefile |
            grep -E 'VERSION|PATCHLEVEL' |
            awk '{print $3}' |
            paste -sd '.'
          )

          echo "[+] Kernel version: $KERNEL_VERSION"

          echo "KERNEL_VERSION=$KERNEL_VERSION" >> "$GITHUB_ENV"
          echo "FIRST_VERSION=$(echo "$KERNEL_VERSION" | awk -F '.' '{print $1}')" >> "$GITHUB_ENV"
          echo "SECOND_VERSION=$(echo "$KERNEL_VERSION" | awk -F '.' '{print $2}')" >> "$GITHUB_ENV"

          echo "::endgroup::"


      # ============================================================
      # Get Kernel Arch
      # ============================================================

      - name: Get Kernel Arch
        shell: bash
        run: |
          set -euxo pipefail

          kernel_dir="$GITHUB_WORKSPACE/device_kernel"

          if [[ -d "$kernel_dir/arch/arm64/configs" ]]; then
            echo "KERNEL_ARCH=arm64" >> "$GITHUB_ENV"
            echo "[+] Kernel architecture: arm64"
          else
            echo "[-] Non-ARM64 devices are not supported!"
            exit 1
          fi


      # ============================================================
      # Validate manually prepared KernelSU
      #
      # KERNELSU_AUTO_GET=false means this action must NOT download,
      # clone, replace, or delete the KernelSU checkout.
      # ============================================================

      - name: Validate KernelSU
        shell: bash
        run: |
          set -euxo pipefail

          kernel_dir="$GITHUB_WORKSPACE/device_kernel"
          ksu_dir="$kernel_dir/KernelSU"

          echo "::group::[+] Validate KernelSU checkout"

          if [[ ! -d "$kernel_dir" ]]; then
            echo "::error::Kernel source directory is missing: $kernel_dir"
            exit 1
          fi

          if [[ ! -f "$kernel_dir/Makefile" ]]; then
            echo "::error::Kernel source is invalid: $kernel_dir"
            exit 1
          fi

          if [[ ! -d "$ksu_dir" ]]; then
            echo "::error::KernelSU checkout is missing: $ksu_dir"
            exit 1
          fi

          if [[ ! -f "$ksu_dir/kernel/Makefile" ]]; then
            echo "::error::KernelSU checkout is missing or invalid: $ksu_dir"
            echo "::error::Expected: $ksu_dir/kernel/Makefile"

            echo "::group::KernelSU contents"
            find "$ksu_dir" -maxdepth 2 -type f | sort || true
            echo "::endgroup::"

            exit 1
          fi

          echo "[+] KernelSU checkout:"
          echo "    $ksu_dir"

          echo "[+] KernelSU commit:"
          git -C "$ksu_dir" rev-parse --short HEAD

          echo "[+] KernelSU branch:"
          git -C "$ksu_dir" branch --show-current || true

          echo "::endgroup::"


      # ============================================================
      # Get Packing Tools
      # ============================================================

      - name: Get Packing Tools
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/device_kernel"

          if [[ "${{ env.PACK_METHOD }}" == "Anykernel3" ]]; then

            if [[ -d "Anykernel3" ]]; then
              echo "[+] Found AnyKernel3 in Kernel!"

            elif [[ "${{ env.AK3_SOURCE }}" == *"osm0sis/AnyKernel3.git" ]]; then

              git clone \
                "${{ env.AK3_SOURCE }}" \
                -b "${{ env.AK3_BRANCH }}" \
                Anykernel3 \
                --depth=1

              cd Anykernel3

              git checkout dca9dc370838d919d56c1f59ec78b27a14a72c68

              cd ../

              echo "[+] Get Anykernel3 successfully!"

            else

              git clone \
                "${{ env.AK3_SOURCE }}" \
                -b "${{ env.AK3_BRANCH }}" \
                Anykernel3 \
                --depth=1

            fi

          elif [[ "${{ env.PACK_METHOD }}" == "MKBOOTIMG" ]] || \
               [[ "${{ env.DEFCONFIG_FROM_BOOT }}" == "true" ]]; then

            cd "$GITHUB_WORKSPACE"

            git clone \
              https://android.googlesource.com/platform/system/tools/mkbootimg \
              "$GITHUB_WORKSPACE/mkboottools" \
              -b main-kernel-build-2024 \
              --depth=1

            ${{ env.CURLX }} \
              "${{ env.BOOT_SOURCE }}" \
              "$GITHUB_WORKSPACE/boot_source_${{ env.DEVICE_NAME }}.img"

            echo "[+] Get MKBOOTIMG successfully!"

            cd "$GITHUB_WORKSPACE/device_kernel"

          else

            echo "[-] Need packing method!"
            exit 1

          fi

          echo "PACK_METHOD=${{ env.PACK_METHOD }}" >> "$GITHUB_ENV"


      # ============================================================
      # Get DEFCONFIG
      # ============================================================

      - name: Get DEFCONFIG
        if: env.DEFCONFIG_SOURCE != '' || env.DEFCONFIG_FROM_BOOT == 'true'
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/device_kernel"

          if [[ -n "${{ env.DEFCONFIG_SOURCE }}" ]]; then

            ${{ env.CURLX }} \
              "${{ env.DEFCONFIG_SOURCE }}" \
              "arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"

          elif [[ -z "${{ env.DEFCONFIG_ORIGIN_IMAGE }}" ]]; then

            if [[ "${{ env.DEFCONFIG_FROM_BOOT }}" == "true" ]]; then

              if [[ -f "${{ env.BOOT_SOURCE }}" ]]; then

                ${{ env.CURLX }} \
                  "${{ env.BOOT_SOURCE }}" \
                  "$GITHUB_WORKSPACE/boot.img"

                "$GITHUB_WORKSPACE/mkboottools/unpack_bootimg.py" \
                  --boot_img "$GITHUB_WORKSPACE/boot.img"

                mv \
                  "$GITHUB_WORKSPACE/out/kernel" \
                  "$GITHUB_WORKSPACE/device_kernel/Image"

                "$GITHUB_WORKSPACE/device_kernel/scripts/extract-ikconfig" \
                  "$GITHUB_WORKSPACE/device_kernel/Image" \
                  > "$GITHUB_WORKSPACE/device_kernel/arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"

              fi

            else

              ${{ env.CURLX }} \
                "${{ env.DEFCONFIG_ORIGIN_IMAGE }}" \
                "$GITHUB_WORKSPACE/device_kernel/Image"

              "$GITHUB_WORKSPACE/device_kernel/scripts/extract-ikconfig" \
                "$GITHUB_WORKSPACE/device_kernel/Image" \
                > "$GITHUB_WORKSPACE/device_kernel/arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"

            fi

          fi


      # ============================================================
      # Clean KernelSU and Hook
      # ============================================================

      - name: Cleaned KernelSU and Hook
        shell: bash
        run: |
          set -euxo pipefail

          kernel_dir="$GITHUB_WORKSPACE/device_kernel"

          cd "$kernel_dir"

          echo "::group::[+] Starting clean hook"

          cp /tmp/Bin/clean_hook.sh ./

          bash clean_hook.sh

          echo "::endgroup::"

          echo "[+] Cleaned hook."


      # ============================================================
      # KernelSU
      #
      # IMPORTANT:
      #
      # KERNELSU_AUTO_GET=false
      #
      # Therefore this section ONLY validates and connects the
      # existing checkout created by Prepare KernelSU.
      #
      # It NEVER clones KernelSU.
      # It NEVER deletes KernelSU.
      # It NEVER runs KernelSU setup.sh.
      # ============================================================

      - name: Set KernelSU
        shell: bash
        run: |
          set -euxo pipefail

          kernel_dir="$GITHUB_WORKSPACE/device_kernel"
          ksu_dir="$kernel_dir/KernelSU"

          echo "::group::[+] KernelSU configuration"

          KERNELSU_AUTO_GET="${{ env.KERNELSU_AUTO_GET }}"
          KERNELSU_AUTO_FORK="${{ env.KERNELSU_AUTO_FORK }}"

          echo "[+] KERNELSU_AUTO_GET=$KERNELSU_AUTO_GET"
          echo "[+] KERNELSU_AUTO_FORK=$KERNELSU_AUTO_FORK"

          # --------------------------------------------------------
          # Automatic KernelSU retrieval is disabled.
          # --------------------------------------------------------

          if [[ "${KERNELSU_AUTO_GET,,}" != "true" ]]; then

            echo "[+] Automatic KernelSU retrieval disabled."
            echo "[+] Reusing existing checkout."

            if [[ ! -d "$ksu_dir" ]]; then
              echo "::error::KernelSU directory is missing: $ksu_dir"
              exit 1
            fi

            if [[ ! -f "$ksu_dir/kernel/Makefile" ]]; then
              echo "::error::KernelSU checkout is missing or invalid: $ksu_dir"
              echo "::error::Expected: $ksu_dir/kernel/Makefile"

              echo "::group::KernelSU contents"
              find "$ksu_dir" -maxdepth 2 -type f | sort || true
              echo "::endgroup::"

              exit 1
            fi

            echo "[+] KernelSU checkout is valid."

            echo "KERNELSU_NAME=KernelSU-Next" >> "$GITHUB_ENV"
            echo "KERNELSU_FOLDER=KernelSU" >> "$GITHUB_ENV"

          else

            echo "::error::Automatic KernelSU retrieval must remain disabled."
            echo "::error::Set KERNELSU_AUTO_GET to false when using Prepare KernelSU."
            exit 1

          fi

          # --------------------------------------------------------
          # Always use the exact downstream-compatible path.
          # --------------------------------------------------------

          if [[ ! -d "$ksu_dir/kernel" ]]; then
            echo "::error::KernelSU kernel directory is missing:"
            echo "::error::$ksu_dir/kernel"
            exit 1
          fi

          # --------------------------------------------------------
          # Create/update the expected kernel integration link.
          # --------------------------------------------------------

          ln -sfn \
            "../KernelSU/kernel" \
            "$kernel_dir/drivers/kernelsu"

          if [[ ! -e "$kernel_dir/drivers/kernelsu" ]]; then
            echo "::error::Failed to create drivers/kernelsu"
            exit 1
          fi

          echo "[+] KernelSU path:"
          echo "    $ksu_dir"

          echo "[+] KernelSU integration:"
          echo "    $kernel_dir/drivers/kernelsu"

          echo "::endgroup::"


      # ============================================================
      # Ensure KernelSU is present in Kconfig/Makefile
      # ============================================================

      - name: Configure KernelSU integration
        shell: bash
        run: |
          set -euxo pipefail

          kernel_dir="$GITHUB_WORKSPACE/device_kernel"
          ksu_dir="$kernel_dir/KernelSU"

          if [[ ! -f "$ksu_dir/kernel/Makefile" ]]; then
            echo "::error::KernelSU checkout is missing or invalid: $ksu_dir"
            exit 1
          fi

          cd "$kernel_dir"

          # drivers/Makefile
          if ! grep -q 'obj-$(CONFIG_KSU) += kernelsu/' \
              "$kernel_dir/drivers/Makefile"; then

            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' \
              >> "$kernel_dir/drivers/Makefile"

          fi

          # drivers/Kconfig
          if ! grep -q 'source "drivers/kernelsu/Kconfig"' \
              "$kernel_dir/drivers/Kconfig"; then

            sed -i \
              '/endmenu/i\source "drivers/kernelsu/Kconfig"' \
              "$kernel_dir/drivers/Kconfig"

          fi

          echo "[+] KernelSU integration configured."


      # ============================================================
      # SukiSU-Ultra Fixed
      # ============================================================

      - name: SukiSU-Ultra Fixed
        shell: bash
        run: |
          set -euxo pipefail

          ksu_dir="$GITHUB_WORKSPACE/device_kernel/KernelSU"

          if [[ ! -d "$ksu_dir" ]]; then
            echo "::error::KernelSU directory is missing: $ksu_dir"
            exit 1
          fi

          if [[ ! -f "$ksu_dir/kernel/Makefile" ]]; then
            echo "::error::Invalid KernelSU checkout: $ksu_dir"
            exit 1
          fi

          if [[ "${{ env.KERNELSU_SOURCE }}" == *SukiSU* ]] || \
             [[ "${{ env.KERNELSU_AUTO_FORK }}" == "sukisu" ]]; then

            cd "$ksu_dir/kernel"

            if [[ -f "/tmp/Patches/Patch/sukisu_ultra_fixed.patch" ]]; then

              cp \
                /tmp/Patches/Patch/sukisu_ultra_fixed.patch \
                ./

              patch -p1 < sukisu_ultra_fixed.patch

              echo "[+] SukiSU-Ultra mitigation measures implemented."

            else

              echo "[-] SukiSU patch not found, skipped."

            fi

          else

            echo "[-] Your KernelSU fork doesn't need this, skipped."

          fi


      # ============================================================
      # xxksu add SuSFS
      # ============================================================

      - name: xxksu add SuSFS
        shell: bash
        run: |
          set -euxo pipefail

          ksu_dir="$GITHUB_WORKSPACE/device_kernel/KernelSU"

          if [[ ! -d "$ksu_dir" ]]; then
            echo "::error::KernelSU directory is missing: $ksu_dir"
            exit 1
          fi

          if [[ ! -f "$ksu_dir/kernel/Makefile" ]]; then
            echo "::error::Invalid KernelSU checkout: $ksu_dir"
            exit 1
          fi

          if [[ "${{ env.KERNELSU_AUTO_FORK }}" == "xxksu" ]] || \
             [[ "${{ env.KERNELSU_SOURCE }}" == *backslashxx* ]]; then

            if [[ "${{ env.SUSFS_ENABLE }}" == "true" ]]; then

              cd "$ksu_dir/kernel"

              patch -p1 < <(
                curl -sL \
                  "https://github.com/midori01/KernelSU/commit/xx.patch"
              ) || true

              echo "[+] xxksu SUSFS applied."

            fi

          else

            echo "[-] Your KernelSU fork doesn't need this, skipped."

          fi


      # ============================================================
      # KPM Function Support
      # ============================================================

      - name: KPM Function Support
        if: env.KPM_ENABLE == 'true'
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/device_kernel"

          ENABLE_KPM_CONFIGS(){

            sed -n \
              '/^config KALLSYMS_ALL/,/^[^ \t]/p' \
              init/Kconfig |
              grep -q 'depends on.*DEBUG_KERNEL' &&
              echo "CONFIG_DEBUG_KERNEL=y" \
                >> "./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"

            echo "CONFIG_KALLSYMS=y" \
              >> "./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"

            echo "CONFIG_KALLSYMS_ALL=y" \
              >> "./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"

          }


          GET_KPM_TOOLS(){

            echo "[+] Detected set_memory."

            echo "CONFIG_KPM=y" \
              >> "./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"

            ${{ env.CURLX }} \
              "${{ env.KPM_PATCH_SOURCE }}" \
              patch

            if [[ -f "patch" ]]; then

              chmod a+x patch

              echo "[+] Get KPM Tools successfully!"

            else

              echo "[-] Get KPM Tools failed!"
              exit 1

            fi

          }


          GET_KPATCH_NEXT_TOOLS(){

            REPO="KernelSU-Next/KPatch-Next"

            ${{ env.CURLX }} \
              "https://github.com/$REPO/releases/latest/download/kpimg-linux" \
              kpimg-linux

            ${{ env.CURLX }} \
              "https://github.com/$REPO/releases/latest/download/kptools-linux" \
              kptools-linux

            if [[ -f "kptools-linux" ]]; then

              chmod a+x kptools-linux

              echo "[+] Get KPatch-Next Tools successfully!"

            else

              echo "[-] Get KPatch-Next Tools failed!"
              exit 1

            fi

          }


          if [[ "${{ env.KERNELSU_SOURCE }}" == *SukiSU* ]] || \
             [[ "${{ env.KERNELSU_AUTO_FORK }}" == "sukisu" ]] && \
             [[ "${{ env.KPM_INLINE }}" == "true" ]]; then

            echo "[+] Detected SukiSU-Ultra and enabled KPM Inline."

            ENABLE_KPM_CONFIGS

            if [[ -f "include/linux/set_memory.h" ]]; then

              GET_KPM_TOOLS

            else

              cp \
                /tmp/Patches/Patch/set_memory_to_49_and_low.patch \
                ./

              patch -p1 < set_memory_to_49_and_low.patch || true

              echo "[+] Patch set_memory successfully!"
              echo "[-] If there is a patch error (.rej), fix it manually."

              GET_KPM_TOOLS

            fi

          elif [[ "${{ env.KPM_INLINE }}" == "true" ]]; then

            echo "[-] Your KernelSU fork could not support KPM Inline!"
            exit 1

          elif [[ "${{ env.KPM_KPATCH_NEXT }}" == "true" ]]; then

            GET_KPATCH_NEXT_TOOLS

          else

            ENABLE_KPM_CONFIGS

            echo "[+] Necessary configuration items have been enabled for KPM."

          fi


      # ============================================================
      # Set KSU for DEFCONFIG
      # ============================================================

      - name: Set KSU for DEFCONFIG
        shell: bash
        run: |
          set -euxo pipefail

          config="$GITHUB_WORKSPACE/device_kernel/arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"

          mkdir -p "$(dirname "$config")"

          if ! grep -q '^CONFIG_KSU=y$' "$config" 2>/dev/null; then
            echo "CONFIG_KSU=y" >> "$config"
          fi

          echo "[+] CONFIG_KSU=y enabled."