name: Build Realme 9 Pro (LineageOS 23.2 A16)

on:
  workflow_call:
  workflow_dispatch:

env:
  DEVICE_NAME: "realme_9_pro"
  DEVICE_CODENAME: "oscar"

  CUSTOM_CMDS: "CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS: "LLVM=1 LLVM_IAS=1"

  KERNEL_SOURCE: "https://github.com/LineageOS/android_kernel_realme_sm6375.git"
  KERNEL_BRANCH: "lineage-23.2"

  CLANG_SOURCE: "https://github.com/bachnxuan/aosp_clang_mirror/releases/download/clang-r563880c-13989888/clang-r563880c.tar.gz"
  CLANG_BRANCH: "lineage-20.0"

  GCC_GNU: false
  GCC_64_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "android12L-release"

  GCC_32_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "vendor/holi-qgki_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  # ============================================================
  # KernelSU
  # ============================================================

  KERNELSU_SOURCE: "https://github.com/KernelSU-Next/KernelSU-Next.git"
  KERNELSU_BRANCH: "legacy"

  # KernelSU is prepared manually by this workflow.
  # build-ready MUST NOT automatically download/fork KernelSU.
  KERNELSU_AUTO_GET: "false"
  KERNELSU_AUTO_FORK: "false"

  KERNELSU_METHOD: "shell"
  KERNELSU_SUS_PATCH: "false"

  # ============================================================
  # SUSFS
  # ============================================================

  SUSFS_ENABLE: true
  SUSFS_FIXED: true

  PATCHES_SOURCE: "Josh19-git/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "common-5.4"

  SUSFS_FOLDER_FIXED: "common"
  SUSFS_PATCH_FIXED: "susfs_fix_fdc"

  # ============================================================
  # AnyKernel3
  # ============================================================

  AK3_SOURCE: "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH: "master"

  # Pin the exact AnyKernel3 revision used for packaging.
  # pack-process must fetch this commit explicitly.
  AK3_COMMIT: "dca9dc370838d919d56c1f59ec78b27a14a72c68"

  BOOT_SOURCE: ""

  NEED_DTBO: false
  NEED_SAFE_DTBO: false

  ROM_TEXT: "lineageos_a16"

  # ============================================================
  # Build / packaging
  # ============================================================

  PYTHON_VERSION: "3"
  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"

  # ============================================================
  # Kernel patches / features
  # ============================================================

  REKERNEL_ENABLE: "false"

  DROIDSPACES_ENABLE: "true"

  NOMOUNT_ENABLE: "false"

  VPNHIDE_ENABLE: "true"
  HOOK_METHOD: "syscall"

  KERNEL_PATCH: "false"

  # ============================================================
  # KPM
  # ============================================================

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"

  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  # ============================================================
  # Baseband Guard
  # ============================================================

  BASEBAND_GUARD_ENABLE: "true"
  BASEBAND_GUARD_BOOT: "false"

  # ============================================================
  # DTB / DTBO
  # ============================================================

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  CUSTOM_DTB: "false"
  DTB_NAME: "yupik"

  # ============================================================
  # Debug / configuration
  # ============================================================

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "true"

  MERGE_CONFIG_FILES: "vendor/debugfs.config,vendor/holi_QGKI.config"

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:

    name: Realme 9 Pro (LineageOS 23.2 A16)

    runs-on: ubuntu-latest

    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:

      # ==========================================================
      # Checkout this build repository
      # ==========================================================

      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      # ==========================================================
      # Kernel source
      #
      # build-ready previously cloned device_kernel itself.
      # We now explicitly clone it before KernelSU preparation.
      # ==========================================================

      - name: 📦 Clone kernel source
        shell: bash
        run: |
          set -euxo pipefail

          kernel_dir="$GITHUB_WORKSPACE/device_kernel"

          rm -rf "$kernel_dir"

          git clone \
            --recursive \
            --depth=1 \
            --single-branch \
            --branch "$KERNEL_BRANCH" \
            "$KERNEL_SOURCE" \
            "$kernel_dir"

          test -d "$kernel_dir"
          test -f "$kernel_dir/Makefile"

          echo "[+] Kernel source:"
          echo "    $kernel_dir"

          echo "[+] Kernel branch:"
          git -C "$kernel_dir" branch --show-current

          echo "[+] Kernel commit:"
          git -C "$kernel_dir" rev-parse HEAD

      # ==========================================================
      # KernelSU
      #
      # IMPORTANT:
      # Local directory MUST be:
      #
      # device_kernel/KernelSU
      #
      # NOT:
      #
      # device_kernel/KernelSU-Next
      # ==========================================================

      - name: 🔐 Prepare KernelSU
        shell: bash
        run: |
          set -euxo pipefail

          kernel_dir="$GITHUB_WORKSPACE/device_kernel"
          ksu_dir="$kernel_dir/KernelSU"

          test -f "$kernel_dir/Makefile"

          rm -rf "$ksu_dir"

          echo "[+] KernelSU source:"
          echo "    $KERNELSU_SOURCE"

          echo "[+] KernelSU branch:"
          echo "    $KERNELSU_BRANCH"

          echo "[+] KernelSU destination:"
          echo "    $ksu_dir"

          git clone \
            --depth=1 \
            --single-branch \
            --branch "$KERNELSU_BRANCH" \
            "$KERNELSU_SOURCE" \
            "$ksu_dir"

          test -d "$ksu_dir"
          test -f "$ksu_dir/kernel/Makefile"

          echo "[+] KernelSU prepared successfully."

          echo "[+] KernelSU commit:"
          git -C "$ksu_dir" rev-parse --short HEAD

      # ==========================================================
      # Verify KernelSU before build-ready
      # ==========================================================

      - name: 🔎 Verify KernelSU layout
        shell: bash
        run: |
          set -euxo pipefail

          kernel_dir="$GITHUB_WORKSPACE/device_kernel"
          ksu_dir="$kernel_dir/KernelSU"

          echo "[+] Checking kernel:"
          test -f "$kernel_dir/Makefile"

          echo "[+] Checking KernelSU:"
          test -d "$ksu_dir"
          test -f "$ksu_dir/kernel/Makefile"

          echo "[+] KernelSU directory:"
          ls -la "$ksu_dir"

          echo "[+] KernelSU kernel directory:"
          ls -la "$ksu_dir/kernel"

      # ==========================================================
      # Compilation environment
      # ==========================================================

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      # ==========================================================
      # Required tools / KernelSU integration
      #
      # KERNELSU_AUTO_GET=false
      # KERNELSU_AUTO_FORK=false
      #
      # build-ready must reuse device_kernel/KernelSU.
      # ==========================================================

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      # ==========================================================
      # Verify KernelSU survived build-ready
      # ==========================================================

      - name: 🔎 Verify KernelSU after build-ready
        shell: bash
        run: |
          set -euxo pipefail

          kernel_dir="$GITHUB_WORKSPACE/device_kernel"
          ksu_dir="$kernel_dir/KernelSU"

          echo "[+] Verifying KernelSU after build-ready..."

          test -d "$ksu_dir"
          test -f "$ksu_dir/kernel/Makefile"

          echo "[+] KernelSU still exists:"
          echo "    $ksu_dir"

          echo "[+] KernelSU HEAD:"
          git -C "$ksu_dir" rev-parse --short HEAD

          echo "[+] drivers/kernelsu:"
          if [[ -e "$kernel_dir/drivers/kernelsu" ]]; then
            ls -ld "$kernel_dir/drivers/kernelsu"
          else
            echo "::error::drivers/kernelsu is missing"
            exit 1
          fi

      # ==========================================================
      # SUSFS
      # ==========================================================

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      # ==========================================================
      # No-kprobe
      # ==========================================================

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      # ==========================================================
      # Extra kernel options
      # ==========================================================

      - name: 🪛 Extra Kernel Options
        shell: bash
        run: |
          set -euxo pipefail

          kernel_dir="$GITHUB_WORKSPACE/device_kernel"

          cd "$kernel_dir"

          test -f /tmp/Patches/Patch/remove_modversion_check.patch
          test -f /tmp/Patches/Patch/add_automatic_dtbo_generation.patch

          cp /tmp/Patches/Patch/remove_modversion_check.patch ./
          cp /tmp/Patches/Patch/add_automatic_dtbo_generation.patch ./

          patch -p1 < remove_modversion_check.patch || true
          patch -p1 < add_automatic_dtbo_generation.patch || true

      # ==========================================================
      # Re:Kernel
      # ==========================================================

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      # ==========================================================
      # DroidSpaces
      # ==========================================================

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      # ==========================================================
      # VPNHide
      # ==========================================================

      - name: 🛡 Patch Kernel of VPNHide
        uses: ./.github/workflows/patch-vpnhide

      # ==========================================================
      # Baseband Guard
      # ==========================================================

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      # ==========================================================
      # NoMount
      # ==========================================================

      - name: 🪝 Patch Kernel of NoMount
        uses: ./.github/workflows/patch-nomount

      # ==========================================================
      # Build kernel
      # ==========================================================

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      # ==========================================================
      # Pack kernel
      #
      # pack-process MUST use AK3_COMMIT and explicitly fetch
      # the pinned commit before checkout.
      # ==========================================================

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      # ==========================================================
      # Upload artifacts
      # ==========================================================

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files